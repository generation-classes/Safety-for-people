<!doctype html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio | SAPE</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Inter:wght@300;400;500&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../../css/styles.css">
</head>

<body class="d-flex flex-column min-vh-100" data-page="inicio">
    <div id="site-header"></div>

    <main class="flex-grow-1">
        <section class="hero-banner">
            <div class="hero-banner-row">

                <!-- Texto -->
                <div class="hero-contenido">

                    <h1>Cuidamos lo que<br>más te <span>importa</span></h1>

                    <div class="hero-botones">
                        <a href="../productos/index.html" class="btn-explorar">Explorar productos</a>
                        <a href="../about-us/" class="btn-categorias">Sobre nosotros</a>
                    </div>

                    <div class="hero-features">
                        <div class="hero-feature-item">
                            <span class="icono"><i class="bi bi-truck"></i></span>
                            <span class="texto">
                                <strong>Envíos rápidos</strong>
                                <span>a todo el país</span>
                            </span>
                        </div>
                        <div class="hero-feature-item">
                            <span class="icono"><i class="bi bi-shield-check"></i></span>
                            <span class="texto">
                                <strong>Pagos seguros</strong>
                                <span>y protegidos</span>
                            </span>
                        </div>
                        <div class="hero-feature-item">
                            <span class="icono"><i class="bi bi-headset"></i></span>
                            <span class="texto">
                                <strong>Atención personalizada</strong>
                                <span>estamos para ayudarte</span>
                            </span>
                        </div>
                    </div>

                </div>

                <!-- Imagen -->
                <div class="hero-imagen">
                    <img src="../../Assets/images/familia.png" alt="Familia sonriendo">
                </div>

            </div>
        </section>

        <section class="categorias-home mt-4">
            <h2>Categorías principales</h2>
            <div class="categorias-grid d-flex flex-wrap justify-content-between gap-4 mt-4">
                <div class="simple-card d-flex flex-column align-items-center justify-content-center rounded-4 bg-white text-center">
                    <img src="../../Assets/images/Security.png" alt="Seguridad" style="width: 58px; height: 58px; object-fit: contain;">
                    <h3>Seguridad</h3>
                </div>
                <div class="simple-card d-flex flex-column align-items-center justify-content-center rounded-4 bg-white text-center">
                    <img src="../../Assets/images/Health.png" alt="Salud y bienestar" style="width: 58px; height: 58px; object-fit: contain;">
                    <h3>Salud y bienestar</h3>
                </div>
                <div class="simple-card d-flex flex-column align-items-center justify-content-center rounded-4 bg-white text-center">
                    <img src="../../Assets/images/Home.png" alt="Hogar" style="width: 58px; height: 58px; object-fit: contain;">
                    <h3>Hogar</h3>
                </div>
                <div class="simple-card d-flex flex-column align-items-center justify-content-center rounded-4 bg-white text-center">
                    <img src="../../Assets/images/Niños.png" alt="Niños" style="width: 58px; height: 58px; object-fit: contain;">
                    <h3>Niños</h3>
                </div>
                <div class="simple-card d-flex flex-column align-items-center justify-content-center rounded-4 bg-white text-center">
                    <img src="../../Assets/images/Tecnology.png" alt="Tecnología" style="width: 58px; height: 58px; object-fit: contain;">
                    <h3>Tecnología</h3>
                </div>
            </div>
        </section>

    </main>

    <div id="site-footer"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="../../app/app.js"></script>
    <script src="../Inicio/inicio.js"></script>
</body>

</html>
