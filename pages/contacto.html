<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto | SAPE</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../styles.css">
</head>

<body class="d-flex flex-column min-vh-100" data-page="contacto">
    <div id="site-header"></div>

    <main class="flex-grow-1 d-flex">
        <section class="container d-flex flex-column align-items-center justify-content-center text-center py-5">
            <h1 class="titulo mb-3">Contacto</h1>
            <span class="badge rounded-pill badge-brand fs-6 px-3 py-2 mb-3">En construcción</span>
            <p class="text-secondary fs-5 mb-0 col-11 col-md-6">Esta sección estará disponible pronto.</p>
        </section>
    </main>

    <section class="container py-5">
        <div class="d-flex justify-content-center">
            <div class="contacto-map">
                <h2 class="contacto-map__title">Puedes encontrarnos en</h2>
                <div class="contacto-map__frame">
                    <iframe
                        src="https://www.google.com/maps?q=4.615894,-74.098786+(SAPE+-+Cra+35+%2310-69,+Puente+Aranda,+Bogot%C3%A1)&output=embed"
                        loading="lazy"
                        referrerpolicy="no-referrer-when-downgrade"
                        allowfullscreen
                        title="Ubicación de SAPE - Cra 35 #10-69, Puente Aranda, Bogotá"></iframe>
                </div>
            </div>
        </div>
    </section>

    <div id="site-footer"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="../app/app.js"></script>
</body>

</html>
