<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi cuenta | SAPE</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Inter:wght@300;400;500&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../../css/styles.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>

<body class="d-flex flex-column min-vh-100" data-page="mi-cuenta">
    <div id="site-header"></div>

    <nav aria-label="breadcrumb" class="container py-3">
        <ol class="breadcrumb mb-0">
            <li class="breadcrumb-item"><a href="../home-usuario/index.html">Inicio</a></li>
            <li class="breadcrumb-item active" aria-current="page">Mi cuenta</li>
        </ol>
    </nav>

    <main class="container pb-5 flex-grow-1">
        <h1 class="fs-3 fw-bold mb-4" style="color:#004D40;">Mi cuenta</h1>

        <div class="card border-0 shadow-sm rounded-4" style="max-width:560px;">
            <div class="card-body p-4">
                <form id="formCuenta" novalidate>
                    <div class="mb-3">
                        <label class="form-label fw-semibold text-secondary small">Nombre</label>
                        <input type="text" class="form-control" id="cuentaNombre" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold text-secondary small">Correo electrónico</label>
                        <input type="email" class="form-control" id="cuentaEmail" disabled>
                        <small class="text-muted">El correo no se puede cambiar desde aquí.</small>
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-semibold text-secondary small">Teléfono</label>
                        <input type="tel" class="form-control" id="cuentaTelefono">
                    </div>
                    <button type="submit" class="btn text-white px-4" id="btnGuardarCuenta"
                        style="background-color:#00897B;border-radius:8px;">Guardar cambios</button>
                </form>
            </div>
        </div>
    </main>

    <div id="site-footer"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="../../app/app.js"></script>
    <script src="../../app/endpoints.js"></script>
    <script src="../../app/services.js"></script>
    <script src="mi-cuenta.js"></script>
</body>

</html>
