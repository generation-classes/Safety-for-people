<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Productos | Admin | SAPE</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Inter:wght@300;400;500&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../../css/styles.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>

<body class="d-flex flex-column min-vh-100" data-page="admin" data-admin-page="productos">
    <div id="site-header"></div>

    <main class="container py-5 flex-grow-1">

        <div id="admin-sidebar"></div>

        <div class="d-flex justify-content-between align-items-center flex-wrap gap-3 mb-4">
            <h1 class="fs-3 fw-bold m-0" style="color:#004D40;">Productos</h1>
            <button type="button" class="btn text-white" style="background-color:#00897B;border-radius:8px;"
                data-bs-toggle="modal" data-bs-target="#modalProducto" id="btnNuevoProducto">
                <i class="bi bi-plus-lg me-1"></i> Agregar producto
            </button>
        </div>

        <div class="card border-0 shadow-sm rounded-4">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table align-middle mb-0">
                        <thead>
                            <tr>
                                <th>Imagen</th>
                                <th>Nombre</th>
                                <th>Categoría</th>
                                <th>Precio</th>
                                <th>Stock</th>
                                <th>Activo</th>
                                <th class="text-end">Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="tablaProductos">
                            <tr>
                                <td colspan="7" class="text-center text-muted py-4">Cargando productos...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mt-3">
                <div class="d-flex align-items-center gap-2">
                    <span class="text-muted small">Mostrar</span>
                    <select id="productosPorPagina" class="form-select form-select-sm" style="width:auto;">
                        <option value="5" selected>5</option>
                        <option value="10">10</option>
                        <option value="15">15</option>
                        <option value="30">30</option>
                        <option value="100">100</option>
                    </select>
                    <span class="text-muted small">por página</span>
                </div>
                <nav id="paginacionProductosAdmin" class="paginacion-admin" aria-label="Paginación de productos"></nav>
            </div>
        </div>

    </main>

    <!-- MODAL CREAR/EDITAR PRODUCTO -->
    <div class="modal fade" id="modalProducto" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content p-4 shadow-lg" style="border-radius:16px;border:none;">
                <div class="modal-header border-0 pb-0">
                    <h5 class="modal-title fw-bold" id="modalProductoTitulo" style="color:#004D40;">
                        <i class="bi bi-tag-fill me-2"></i> Agregar producto
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <form id="formProducto" novalidate>
                    <input type="hidden" id="productoId">
                    <div class="modal-body">
                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label class="form-label fw-semibold text-secondary small">Nombre</label>
                                <input type="text" class="form-control" id="productoNombre" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold text-secondary small">Categoría</label>
                                <select class="form-select" id="productoCategoria" required></select>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold text-secondary small">Descripción</label>
                            <textarea class="form-control" id="productoDescripcion" rows="3"></textarea>
                        </div>
                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label class="form-label fw-semibold text-secondary small">Precio</label>
                                <input type="number" class="form-control" id="productoPrecio" min="0" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold text-secondary small">Stock</label>
                                <input type="number" class="form-control" id="productoStock" min="0" required>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold text-secondary small">Características (separadas por coma)</label>
                            <input type="text" class="form-control" id="productoCaracteristicas"
                                placeholder="Botón de emergencia, Resistencia al agua">
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold text-secondary small">Imagen (URL)</label>
                            <input type="url" class="form-control" id="productoImagenUrl" placeholder="https://ejemplo.com/imagen.jpg">
                            <div><img id="productoImagenPreview" class="mt-2 d-none" style="max-height:100px;border-radius:8px;"></div>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="productoActivo" checked>
                            <label class="form-check-label" for="productoActivo">Producto activo</label>
                        </div>
                    </div>
                    <div class="modal-footer border-0 pt-0">
                        <button type="button" class="btn px-4" data-bs-dismiss="modal"
                            style="border:1px solid #006D77;color:#006D77;border-radius:8px;">Cancelar</button>
                        <button type="submit" class="btn px-4 text-white" id="btnGuardarProducto"
                            style="background-color:#00897B;border-radius:8px;">Guardar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <div id="site-footer"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="../../app/app.js"></script>
    <script src="../../app/endpoints.js"></script>
    <script src="../../app/services.js"></script>
    <script src="productos-admin.js"></script>
</body>

</html>
