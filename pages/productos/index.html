<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Productos | SAPE</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../css/styles.css">
  <link rel="stylesheet" href="productos.css">
</head>
<body class="d-flex flex-column min-vh-100" data-page="productos">
  <div id="site-header"></div>
  <section class="catalogo-header">
    <div class="catalogo-header-contenido">
      <h1>Catálogo de productos</h1>
      <p>Encuentra dispositivos que brindan confianza, seguridad y tranquilidad.</p>
    </div>
  </section>
  <section class="catalogo-contenido">
    <aside class="filtros" aria-label="Filtros de productos">
      <h2>Filtrar productos</h2>
      <div class="filtro-grupo">
        <h3>Categorías</h3>
        <label><input class="filtro-categoria" type="radio" name="categoria" value="todos" checked> Todos los productos</label>
        <label><input class="filtro-categoria" type="radio" name="categoria" value="relojes"> Relojes GPS</label>
        <label><input class="filtro-categoria" type="radio" name="categoria" value="cadenas"> Cadenas GPS</label>
        <label><input class="filtro-categoria" type="radio" name="categoria" value="pulseras"> Pulseras GPS</label>
        <label><input class="filtro-categoria" type="radio" name="categoria" value="ninos"> Para niños</label>
        <label><input class="filtro-categoria" type="radio" name="categoria" value="adultos-mayores"> Para adultos mayores</label>
      </div>
      <div class="filtro-grupo">
        <h3>Precio máximo</h3>
        <input id="filtroPrecio" type="range" min="0" max="400000" step="10000" value="400000">
        <div class="rango-precio-valores"><span>Hasta</span><span id="precioSeleccionado">$400.000 COP</span></div>
      </div>
      <div class="filtro-caracteristicas">
        <h3>Características</h3>
        <label><input class="filtro-caracteristica" type="checkbox" value="emergencia"> Botón de emergencia</label>
        <label><input class="filtro-caracteristica" type="checkbox" value="agua"> Resistencia al agua</label>
        <label><input class="filtro-caracteristica" type="checkbox" value="ubicacion"> Ubicación en tiempo real</label>
        <label><input class="filtro-caracteristica" type="checkbox" value="bateria"> Batería de larga duración</label>
      </div>
    </aside>
    <div class="productos">
      <div class="productos-header">
        <span id="cantidadProductos" aria-live="polite"></span>
        <div class="ordenar"><label for="ordenar">Ordenar por</label><select id="ordenar"><option value="precio-asc">Precio: menor a mayor</option><option value="precio-desc">Precio: mayor a menor</option><option value="nombre">Nombre</option></select></div>
      </div>
      <div id="productosGrid" class="productos-grid"></div>
      <p id="sinResultados" class="sin-resultados" hidden>No hay productos que coincidan con los filtros seleccionados.</p>
    </div>
  </section>
  <div id="site-footer"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script defer src="../../app/app.js"></script>
  <script defer src="catalogo-data.js"></script>
  <script defer src="products.js"></script>
</body>
</html>
