<!doctype html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Detalle del producto | SAPE</title>

  <!-- Bootstrap -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <!-- Bootstrap Icons -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
  >

  <!-- Fuentes -->
  <link
    href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Inter:wght@300;400;500&display=swap"
    rel="stylesheet"
  >

  <!-- CSS principal -->
  <link
    rel="stylesheet"
    href="../../css/styles.css"
  >

  <!-- CSS del detalle -->
  <link
    rel="stylesheet"
    href="detalle.css"
  >

</head>


<body
  class="d-flex flex-column min-vh-100"
  data-page="productos"
>


  <!-- HEADER -->

  <div id="site-header"></div>


  <!-- BREADCRUMB -->

  <nav
    aria-label="breadcrumb"
    class="detalle-breadcrumb"
  >

    <ol class="breadcrumb mb-0">

      <li class="breadcrumb-item">

        <a href="../../pages/home-usuario/index.html">
          Inicio
        </a>

      </li>

      <li class="breadcrumb-item">

        <a href="index.html">
          Productos
        </a>

      </li>

      <li
        class="breadcrumb-item active"
        aria-current="page"
        id="breadcrumbProducto"
      >
        Producto
      </li>

    </ol>

  </nav>


  <!-- ENCABEZADO -->

  <section class="detalle-header">

    <div class="detalle-header-contenido">

      <h1>
        Detalle del producto
      </h1>

      <p>
        Información completa del dispositivo que estás buscando.
      </p>

    </div>

  </section>


  <!-- CONTENIDO PRINCIPAL -->

  <section class="detalle-contenido">

    <div class="row g-4 align-items-center">


      <!-- IMAGEN -->

      <div class="col-12 col-lg-6">

        <div class="detalle-imagen">

          <img
            id="imagenProducto"
            src="../../Assets/images/pulsera.png"
            alt="Producto"
          >

        </div>

      </div>


      <!-- INFORMACIÓN -->

      <div class="col-12 col-lg-6">

        <div class="detalle-info">


          <!-- CATEGORÍA -->

          <span
            class="detalle-categoria"
            id="categoriaProducto"
          >

            <i class="bi bi-tag-fill"></i>

            Producto

          </span>


          <!-- NOMBRE -->

          <h2 id="nombreProducto">
            Producto
          </h2>


          <!-- PRECIO -->

          <p
            class="detalle-precio"
            id="precioProducto"
          >
            $0 COP
          </p>


          <!-- DESCRIPCIÓN -->

          <p
            class="detalle-descripcion"
            id="descripcionProducto"
          >
            Información del producto.
          </p>


          <!-- STOCK -->

          <p
            class="detalle-stock disponible"
            id="stockProducto"
          >

            <i class="bi bi-check-circle-fill"></i>

            Stock disponible

          </p>


          <!-- CARACTERÍSTICAS -->

          <ul
            class="detalle-caracteristicas"
            id="caracteristicasProducto"
          >
          </ul>


          <!-- COMPRA -->

          <div class="detalle-comprar">


            <!-- CANTIDAD -->

            <div class="detalle-cantidad">

              <button
                type="button"
                class="cantidad-btn"
                id="btnDisminuir"
                aria-label="Disminuir cantidad"
              >

                <i class="bi bi-dash-lg"></i>

              </button>


              <input
                type="number"
                class="cantidad-input"
                id="cantidadProducto"
                value="1"
                min="1"
                aria-label="Cantidad"
              >


              <button
                type="button"
                class="cantidad-btn"
                id="btnAumentar"
                aria-label="Aumentar cantidad"
              >

                <i class="bi bi-plus-lg"></i>

              </button>

            </div>


            <!-- CARRITO -->

            <button
              type="button"
              class="detalle-btn-carrito"
              id="btnAgregarCarrito"
            >

              <i class="bi bi-cart3"></i>

              Agregar al carrito

            </button>

          </div>

        </div>

      </div>

    </div>

  </section>


  <!-- FOOTER -->

  <div id="site-footer"></div>


  <!-- BOOTSTRAP -->

  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    crossorigin="anonymous"
  ></script>


  <!-- JS PRINCIPAL -->

  <script src="../../app/app.js"></script>


  <!-- ÚNICO JS DE PRODUCTOS / DASHBOARD -->

  <script src="../home-administrador/dashboard.js"></script>


</body>

</html>
