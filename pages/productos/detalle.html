<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pulsera GP| SAPE</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Inter:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../../css/styles.css" />
    <link rel="stylesheet" href="detalle.css" />
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  </head>

  <body class="d-flex flex-column min-vh-100" data-page="productos">
    <!-- Encabezado -->
    <div id="site-header"></div>

    <!-- Ruta de navegación -->
    <nav aria-label="breadcrumb" class="detalle-breadcrumb">
      <ol class="breadcrumb mb-0">
        <li class="breadcrumb-item">
          <a href="../../pages/home-usuario/index.html">Inicio</a>
        </li>
        <li class="breadcrumb-item">
          <a href="index.html">Productos</a>
        </li>
        <li class="breadcrumb-item active" aria-current="page" id="breadcrumbProducto">
          Producto
        </li>
      </ol>
    </nav>

    <!-- Encabezado del detalle -->
    <section class="detalle-header">
      <div class="detalle-header-contenido">
        <h1>Detalle del producto</h1>
        <p>Información completa del dispositivo que estás buscando.</p>
      </div>
    </section>

    <!-- Contenido del detalle -->
    <section class="detalle-contenido" id="contenidoDetalle">
      <div class="row g-4 align-items-center">
        <!-- Imagen del producto -->
        <div class="col-12 col-lg-6">
          <div class="detalle-imagen">
            <img
              id="imagenProducto"
              src="../../Assets/images/pulsera.png"
              alt="Producto"
            />
          </div>
        </div>

        <!-- Información del producto -->
        <div class="col-12 col-lg-6">
          <div class="detalle-info">
            <!-- Categoría -->
            <span class="detalle-categoria" id="categoriaProducto">
              <i class="bi bi-tag-fill"></i>
              Producto
            </span>

            <!-- Nombre -->
            <h2 id="nombreProducto">Producto</h2>

            <!-- Precio -->
            <p class="detalle-precio" id="precioProducto">$0 COP</p>

            <!-- Descripción -->
            <p class="detalle-descripcion" id="descripcionProducto">
              Información del producto.
            </p>

            <!-- Disponibilidad -->
            <p class="detalle-stock disponible" id="stockProducto">
              <i class="bi bi-check-circle-fill"></i>
              Stock disponible
            </p>

            <!-- Características -->
            <ul class="detalle-caracteristicas" id="caracteristicasProducto"></ul>

            <!-- Compra -->
            <div class="detalle-comprar">
              <div class="detalle-cantidad">
                <button type="button" class="cantidad-btn" aria-label="Disminuir cantidad">
                  <i class="bi bi-dash-lg"></i>
                </button>
                <input
                  type="number"
                  class="cantidad-input"
                  value="1"
                  min="1"
                  aria-label="Cantidad"
                />
                <button type="button" class="cantidad-btn" aria-label="Aumentar cantidad">
                  <i class="bi bi-plus-lg"></i>
                </button>
              </div>

              <button type="button" class="detalle-btn-carrito">
                <i class="bi bi-cart3"></i>
                Agregar al carrito
              </button>
            </div>
          </div>
        </div>
      </div>
    </section>

    <div id="site-footer"></div>

    <!-- Bootstrap -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>

    <!-- Scripts del proyecto -->
    <script src="../../app/app.js"></script>
    <script src="productos-data.js"></script>
    <script src="detalle.js"></script>
  </body>
</html>
