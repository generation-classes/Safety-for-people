<!doctype html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio | SAPE</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>

<body class="d-flex flex-column min-vh-100" data-page="inicio">
    <div id="site-header"></div>

    <main class="flex-grow-1">
        <section class="hero-banner">
            <div class="container">
                <div class="row align-items-center g-5">

                    <!-- Columna izquierda: texto -->
                    <div class="col-lg-5">

                        <h1>Cuidamos lo que<br>más te <span>importa</span></h1>

                        <div class="hero-botones">
                            <a href="#" class="btn-explorar">Explorar productos</a>
                            <a href="#" class="btn-categorias">Ver categorías</a>
                        </div>

                        <div class="hero-features">
                            <div class="hero-feature-item">
                                <span class="icono"><i class="bi bi-truck"></i></span>
                                <span class="texto">
                                    <strong>Envíos rápidos</strong>
                                    <span>a todo el país</span>
                                </span>
                            </div>
                            <div class="hero-feature-item">
                                <span class="icono"><i class="bi bi-shield-check"></i></span>
                                <span class="texto">
                                    <strong>Pagos seguros</strong>
                                    <span>y protegidos</span>
                                </span>
                            </div>
                            <div class="hero-feature-item">
                                <span class="icono"><i class="bi bi-headset"></i></span>
                                <span class="texto">
                                    <strong>Atención personalizada</strong>
                                    <span>estamos para ayudarte</span>
                                </span>
                            </div>
                        </div>

                    </div>

                    <!-- Columna derecha: imagen -->
                    <div class="col-lg-6">
                        <div class="hero-imagen">
                            <img src="familia.png" alt="Familia sonriendo">
                        </div>
                    </div>

                </div>
            </div>
        </section>
    </main>

    <div id="site-footer"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="app/app.js"></script>
</body>

</html>
