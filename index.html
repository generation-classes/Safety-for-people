<!doctype html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio | SAPE</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Inter:wght@300;400;500&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>

<body class="d-flex flex-column min-vh-100" data-page="inicio">
    <div id="site-header"></div>

    <main class="flex-grow-1 d-flex flex-column">
        <section class="container d-flex flex-column align-items-center justify-content-center text-center py-5">
            <h1 class="titulo mb-3">Inicio</h1>
            <span class="badge rounded-pill badge-brand fs-6 px-3 py-2 mb-3">En construcción</span>
            <p class="text-secondary fs-5 mb-0 col-11 col-md-6">Esta sección estará disponible pronto.</p>
        </section> 
        <section class="d-flex flex-column w-100 p-5">
            <h1 class="titulo mb-3 mb-5 pb-5">
                Categorías principales
            </h1>
            <div class="d-flex flex-column flex-lg-row gap-4 justify-content-between align-items-center">
                <div class="bg-light d-flex flex-column px-5 py-4 rounded-5 simple-card text-center align-items-center justify-content-center">
                    <img class="img-fluid w-75" src="Assets/images/Security.png" alt="Escudo seguridad">
                    <h3 class="fs-4 fw-bold">seguridad</h3>
                </div>

                <div class="bg-light d-flex flex-column px-5 py-4 rounded-5 simple-card text-center align-items-center justify-content-center">
                    <img class="img-fluid w-75" src="Assets/images/Health.png" alt="Corazon y manos">
                    <h3 class="fs-4 fw-bold">Salud y Bienestar</h3>
                </div>

                <div class="bg-light d-flex flex-column px-5 py-4 rounded-5 simple-card text-center align-items-center justify-content-center">
                    <img class="img-fluid w-75" src="Assets/images/Niños.png" alt="Niños">
                    <h3 class="fs-4 fw-bold">Niños</h3>
                </div>

                <div class="bg-light d-flex flex-column px-5 py-4 rounded-5 simple-card text-center align-items-center justify-content-center">
                    <img class="img-fluid w-75" src="Assets/images/Tecnology.png" alt="Accesorio">
                    <h3 class="fs-4 fw-bold">Tecnologia</h3>
                </div>
            </div>
        </section>
    </main>

    <div id="site-footer"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="app/app.js"></script>
</body>

</html>
